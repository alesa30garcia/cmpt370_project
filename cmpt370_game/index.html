<!DOCTYPE html>
<html id="parent" style="width: 100%; height: 100%; margin: 0; padding: 0;">

<head>
    <meta charset="utf-8">
    <title>WebGL Engine</title>
    <link rel="shortcut icon" href="favicon.ico" />
</head>

<body style="width: 100%; height: 100%; margin: 0; padding: 0">
    <!-- This is the navigation bar at the top of the page -->
    <!-- This is populated by loading the common functions script -->
    <div id="myNavBar"></div>

    <!-- This is for displaying errors caused by our JavaScript -->
    <!-- This will only be populated when an error on the JavaScript side occurs -->
    <div id="webglError"></div>

    <!-- Loading bar using a simple gif -->
    <div id="loadingPage" style="
    width: 100%;
    height: 100%;
    position: absolute; 
    background-color: black; 
    background-image: url(./loading.gif); 
    background-repeat: no-repeat; 
    background-position: center; ">
    </div>

    <!-- main canvas to be rendered -->
    <canvas id="glCanvas" style=
    "width: 100%; height: 100%; display:block; z-index: 1" > </canvas>

    <!-- counter for items collected -->
    <div id = "itemCounter" style = 
    "
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: AliceBlue;
    padding: 10px ;
    border: 2px solid black;
    font-size: 24px;
    color: DarkSlateBlue;
    font-family: Garamond, serif;
    "
    >
     Items Collected: 0
</div>



    <div id = "gameOver" style =  "
    width: 100%;
    height: 100%;
    top:0;
    left: 0;
    position: fixed; 
    background-color: DarkSlateBlue;
    color: white;
    font-size: 32px;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column; 
    z-index: 9999;
    ">

    <div id = "finalMessage" 
    style = "color: Cornsilk;" > Successful Robbery  </div>

    <div id = "finalScore" style = "color: Cornsilk;"> </div>

     <button onclick = "restartGame()"
     style = "
     margin-top: 20px;
     padding: 15px;
     font-size: 24px;
     border: 3px solid black;
     font-family: Garamond, serif;
     font-weight: bold;
     background-color: AliceBlue;
     "
     > Restart Game </button>
    
</div>



    <!-- This is a third party library for matrix math needed for WebGL calculations -->
    <!-- See http://glmatrix.net/ for documentation -->
    <script src="./lib/gl-matrix.js" type="text/javascript"></script>
    <script src="./lib/three-object-loader.js" type="text/javascript"></script>
    <script src="./src/commonFunctions.js" type="text/javascript"></script>
    <script src="./src/objects/RenderObject.js" type="text/javascript"></script>
    <script src="./src/objects/Cube.js" type="text/javascript"></script>
    <script src="./src/objects/Model.js" type="text/javascript"></script>
    <script src="./src/objects/Plane.js" type="text/javascript"></script>
    <script src="./src/objects/CustomObject.js" type="text/javascript"></script>
    <script src="./src/sceneFunctions.js" type="text/javascript"></script>
    <script src="./src/game.js" type="text/javascript"></script>

    <!-- This is our example 
    <script src="./main.js" type="text/javascript"></script>-->
    <script src="./src/main.js" type="text/javascript"></script>
    <script src="./src/uiSetup.js" type="text/javascript"></script>


     <!-- sound effects for robber collisions -->
    <audio id="collectionSound">
        <source src="./assets/collecting.mp3" type="audio/mpeg">
    </audio>

    <audio id = "dogBark">
        <source src="./assets/dogBark.mp3" type="audio/mpeg">
      
    </audio>
</body>




</html>
